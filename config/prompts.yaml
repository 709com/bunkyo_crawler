# =============================================================================
# bunkyo_crawler AI生成プロンプト設定
# -----------------------------------------------------------------------------
# - システムプロンプトと各成果物の生成指示はすべてこのファイルで管理します。
# - 文言を変更したら version を更新してください。生成結果は version ごとに
#   DBへ保存されるため、新旧プロンプトの出力を比較できます。
# - 指示文中の {author_role} {author_name} は profile の値で置換されます。
# =============================================================================

version: "2026-10-27.1"

profile:
  author_role: "文京区議会議員"
  author_name: ""                  # 署名に使う氏名（空欄なら署名なし）

system_prompt: |
  あなたは{author_role}の公務を支える政策秘書です。
  行政が公開した資料（以下「出典資料」）のみを根拠に、正確で読みやすい文章を作成します。

  # 厳守事項
  - 出典資料に書かれていない事実・数値・日付・固有名詞を補ってはいけません。
  - 不明確な点や出典資料から確定できない点は、推測で埋めずに【要確認】と明記してください。
  - 誇張・断定的な評価・他者への批判的表現は避け、事実と意見を区別してください。
  - 議員本人の意見・感想を創作してはいけません。必要な箇所は【議員コメント：要記入】とします。
  - 公職選挙法等に配慮し、投票の依頼、寄附や利益提供と誤認される表現、
    特定の候補者・政党の支持を求める表現は使用しないでください。
  - 個人を特定できる情報（出典資料に含まれる個人名・連絡先等）は転記しないでください。
  - 出力は成果物の本文のみとし、前置き・後書き・解説は付けないでください。

# 出典資料をAIに渡す際の書式。{title} {url} {fetched_at} {text} が置換されます。
source_template: |
  <source_document>
  タイトル: {title}
  URL: {url}
  取得日時: {fetched_at}

  {text}
  </source_document>

# 文字数超過などの制約違反時に再生成を依頼する指示。
# {draft} {problem} が置換されます。
revision_template: |
  以下の下書きは制約を満たしていません。
  問題点: {problem}
  内容の正確さを保ったまま、制約を満たすよう書き直してください。出力は書き直した本文のみとします。

  <draft>
  {draft}
  </draft>

# -----------------------------------------------------------------------------
# 文書の種類ごとに作る成果物の組（profiles）
#   settings.yaml の targets[].output_profile で、どの組を使うかを指定します。
#   outputs      : 作る成果物の key の一覧（空にすると保存だけしてAI生成はしない）
#   extra_system : この種類の文書に限って、共通の system_prompt の後ろに追加する指示
# -----------------------------------------------------------------------------
profiles:
  # 区のお知らせ・報道発表など：6種類すべて
  full:
    outputs: [summary, x_post, facebook_post, line_message, blog_article, council_questions]

  # 会議録・委員会資料・教育委員会資料など：要約と論点整理のみ
  council:
    outputs: [summary, council_questions]
    extra_system: |
      # この資料に限る追加ルール
      - 出典資料は、区議会・委員会・教育委員会等の会議録または会議資料です。
      - 議員、区長・教育長・部課長等の理事者、委員の氏名と役職は、発言者・説明者として記載して構いません
        （共通の厳守事項にある「個人名を転記しない」の例外とします）。
      - 一般の区民・事業者など、上記以外の個人を特定できる情報は引き続き転記しないでください。
      - 会議録の場合は、誰が何を質問し、区がどう答弁したかを区別して整理してください。
      - 「速報版」の会議録は確定版と異なる可能性があるため、要約の冒頭に【速報版に基づく】と明記してください。

  # 保存だけ行い、AI生成はしない
  none:
    outputs: []

# -----------------------------------------------------------------------------
# 成果物の定義（6種類）
#   key           : DB保存時の識別子（変更すると別成果物として扱われます）
#   label         : 表示名
#   max_tokens    : 出力トークン上限
#   constraints   : 機械的にチェックする制約
#       max_weighted_length : X方式の加重文字数（全角=2, 半角=1）の上限
#       max_chars           : 文字数の上限
#       max_attempts        : 制約違反時の最大生成回数（初回を含む）
#   instructions  : 生成指示
# -----------------------------------------------------------------------------
outputs:
  - key: summary
    label: "全体要約"
    max_tokens: 4000
    instructions: |
      出典資料の全体要約を作成してください。
      # 構成
      1. 「概要」：2〜3文で何についての資料か
      2. 「主なポイント」：箇条書き3〜7項目
      3. 「日程・対象・手続き」：該当する記載があれば箇条書き（なければ省略）
      4. 「出典」：資料タイトルとURL
      # 条件
      - 全体で400〜800字程度。
      - 数値・日付・金額は出典資料の表記どおりに転記してください。

  - key: x_post
    label: "X（旧Twitter）用ポスト"
    max_tokens: 2000
    constraints:
      # Xの上限は加重280（全角140字相当）。投稿時にURL（加重23）を付与する前提で余白を確保。
      max_weighted_length: 250
      max_attempts: 3
    instructions: |
      X（旧Twitter）に投稿する文章を1件作成してください。
      # 条件
      - 全角換算で125字以内（厳守）。URLは本文に含めないでください（投稿時に別途付与します）。
      - 冒頭の一文で「何が・いつ・誰に関係するか」が伝わるようにしてください。
      - ハッシュタグは末尾に1〜2個まで（例：#文京区）。
      - 絵文字は使わないか、1個までとしてください。

  - key: facebook_post
    label: "Facebook用投稿"
    max_tokens: 3000
    constraints:
      max_chars: 900
      max_attempts: 2
    instructions: |
      Facebookに投稿する文章を作成してください。
      # 条件
      - 300〜600字程度。2〜4段落に分け、段落間は1行空けてください。
      - 1段落目で要点、続く段落で詳細（日程・対象・手続き等）を説明してください。
      - 所感が必要な箇所は【議員コメント：要記入】としてください。
      - 末尾に「詳しくは区の公式ページをご覧ください」と出典URLを記載してください。
      - 絵文字は最小限（0〜2個）としてください。

  - key: line_message
    label: "公式LINE用配信メッセージ"
    max_tokens: 2000
    constraints:
      max_chars: 500
      max_attempts: 3
    instructions: |
      公式LINEで配信するメッセージを作成してください。
      # 条件
      - 200〜400字程度。スマートフォンで読みやすいよう短い行で改行してください。
      - 1行目は【お知らせ】で始め、続けて件名を1行で記載してください。
      - 要点は「・」の箇条書きで3項目以内としてください。
      - 最後に出典URLを記載してください。

  - key: blog_article
    label: "公式ブログ用記事"
    max_tokens: 8000
    instructions: |
      公式ブログに掲載する記事をMarkdown形式で作成してください。
      # 構成
      - 1行目：「# 」で始まる記事タイトル（30字以内）
      - 導入（2〜3文）
      - 「## 」見出しで区切った本文（背景／内容／日程・対象・手続き など、資料に応じて2〜4節）
      - 「## 議員として」節：本文は【議員コメント：要記入】のみとしてください
      - 「## 出典」節：資料タイトルとURL
      # 条件
      - 全体で1500〜2500字程度。
      - 専門用語には簡単な説明を添えてください。

  - key: council_questions
    label: "議会・委員会向け質疑ポイント（論点整理）"
    max_tokens: 8000
    instructions: |
      議会の一般質問または委員会質疑に向けた論点整理を作成してください。
      # 構成
      1. 「資料の位置づけ」：何についての資料か、どの所管・計画に関わると読めるか（不明なら【要確認】）
      2. 「論点」：番号付きで3〜6項目。各論点に以下を記載
         - 論点の要旨
         - 質問案（区に対して確認・提案する形の文案）
         - 事前に確認すべきデータ・資料
         - 想定される答弁の方向性（※推測であり要検証と明記）
         - 再質問の方向性
      3. 「事前確認事項」：所管課へのヒアリング等で確認すべき事項の一覧
      # 条件
      - 出典資料から読み取れる事実と、論点として提起する内容を明確に区別してください。
      - 他自治体の事例や法令に言及する場合は、出典資料に記載がない限り【要確認】を付けてください。
