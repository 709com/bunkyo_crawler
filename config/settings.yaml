# =============================================================================
# bunkyo_crawler 動作設定
# -----------------------------------------------------------------------------
# - 相対パスはリポジトリのルートを基準に解決されます。
# - APIキー等の秘密情報はこのファイルに書かず、必ず環境変数で渡してください。
# - 環境変数 BUNKYO_CRAWLER_SETTINGS で別の設定ファイルを指定できます。
# =============================================================================

crawler:
  # User-Agent。{version} と {contact} は自動で置換されます。
  # 相手先の管理者が連絡を取れるよう、contact には運用者の連絡先URL等を必ず設定してください。
  user_agent: "BunkyoCrawler/{version} (+{contact}; low-frequency public information monitoring)"
  contact: "https://example.invalid/contact"   # ← 運用開始前に必ず変更

  # --- 負荷軽減 ---
  request_interval_sec: 5.0        # 同一ホストへのリクエスト最小間隔（秒）
  interval_jitter_sec: 1.0         # 間隔に加えるランダム揺らぎ（0〜この値、秒）
  timeout_sec: 30                  # 1リクエストのタイムアウト（秒）
  max_content_bytes: 10485760      # 取得する本文の上限（10MB）。超過分は打ち切り

  # --- リトライ（指数関数的バックオフ） ---
  max_retries: 4                   # 初回を除く最大リトライ回数
  backoff_base_sec: 2.0            # 待機 = base * 2^試行回数 + 揺らぎ
  backoff_max_sec: 120.0           # 1回あたりの待機上限
  retry_after_max_sec: 600.0       # Retry-After がこれを超える場合はリトライせず中止
  retry_status_codes: [429, 500, 502, 503, 504]

  # --- robots.txt ---
  respect_robots_txt: true         # false にはしないでください
  robots_cache_ttl_sec: 86400      # robots.txt の再取得間隔（秒）

  # --- 取得対象とするContent-Type ---
  allowed_content_types:
    - text/html
    - application/xhtml+xml
    - text/plain
    - application/pdf              # PDF の本文抽出には pypdf が必要

# -----------------------------------------------------------------------------
# 収集対象
#
# type（種類）
#   feed  : RSS（更新情報の配信ファイル）を読み、載っている記事を取得
#   index : 一覧ページを読み、本文中のリンク先（記事・PDF）を取得
#   page  : 指定したページそのものを取得
#
# 主な項目
#   output_profile    : AIで作る成果物の組（prompts.yaml の profiles）
#                       full = 6種類 / council = 要約と論点整理 / none = 保存のみ
#   interval_days     : 前回から何日あけて実行するか（0 = 毎回、7 = 週1回）
#   max_pages         : 1回の実行で区のサイトにアクセスする回数の上限
#   max_depth         : 一覧ページから、さらに下の一覧ページを何段たどるか
#   list_patterns     : 「一覧ページ」とみなすアドレス（正規表現）。保存せずリンク集めにだけ使う
#   item_patterns     : 取得する記事のアドレス（空なら一覧に載っている全リンク）
#   exclude_patterns  : 取得しないアドレス
#   attachment_patterns : 記事ページの中で、併せて取得する添付ファイル（PDF等）
#
# 一度取得した記事は、次回以降は取りに行きません（RSSの日付が新しくなった場合を除く）。
# 年のフォルダ（r08 = 令和8年）は「r08以降」に一致する書き方にしてあるため、
# 年が替わっても設定の書き換えは不要です。
# -----------------------------------------------------------------------------
targets:
  # ===== 毎日確認するもの =====================================================
  - name: bunkyo_shinchaku_rss
    description: "文京区 新着情報（RSS）"
    type: feed
    url: "https://www.city.bunkyo.lg.jp/shinchaku/shinchaku.xml"
    output_profile: full
    interval_days: 0
    max_pages: 60

  - name: bunkyo_chuumoku_rss
    description: "文京区 注目情報（RSS）"
    type: feed
    url: "https://www.city.bunkyo.lg.jp/chuumoku/chuumoku.xml"
    output_profile: full
    interval_days: 0
    max_pages: 30

  - name: kugikai_shinchaku
    description: "文京区議会 新着情報（会議録速報版・委員会資料などの掲載を想定）"
    type: index
    url: "https://www.city.bunkyo.lg.jp/kugikai/shinchaku/index.html"
    output_profile: council
    interval_days: 0
    max_depth: 2
    max_pages: 80
    list_patterns:
      - "/kugikai/kekka/gian/[a-z_]+/index\\.html$"
      - "/kugikai/kekka/gian/[a-z_]+/r(0[8-9]|[1-9][0-9])/index\\.html$"
    exclude_patterns:
      - "/index\\.html$"           # 上記以外の一覧ページ（過去の年など）はたどらない
    attachment_patterns:
      - "\\.pdf$"

  # ===== 週1回確認するもの（区議会の新着情報・RSSで拾えなかった分の念のための確認） =====
  - name: houdou
    description: "報道発表資料（令和8年以降）"
    type: index
    # ※ 一覧の入口ページのアドレスは未確認です。エラーになる場合は区のサイトで確認して修正してください。
    url: "https://www.city.bunkyo.lg.jp/kuseijouhou/kouhou/houdou/index.html"
    output_profile: full
    interval_days: 7
    max_depth: 2
    max_pages: 150
    list_patterns:
      - "/kuseijouhou/kouhou/houdou/r(0[8-9]|[1-9][0-9])/index\\.html$"
      - "/kuseijouhou/kouhou/houdou/r(0[8-9]|[1-9][0-9])/[0-9]{1,2}/index\\.html$"
    exclude_patterns:
      - "/index\\.html$"

  - name: kugikai_iinkai_shiryo
    description: "区議会 委員会資料（各委員会・令和8年以降）"
    type: index
    url: "https://www.city.bunkyo.lg.jp/kugikai/kekka/index.html"
    output_profile: council
    interval_days: 7
    max_depth: 3
    max_pages: 200
    list_patterns:
      - "/kugikai/kekka/gian/index\\.html$"
      - "/kugikai/kekka/gian/[a-z_]+/index\\.html$"
      - "/kugikai/kekka/gian/[a-z_]+/r(0[8-9]|[1-9][0-9])/index\\.html$"
    item_patterns:
      - "/kugikai/p[0-9]+\\.html$"   # 各委員会・各定例議会の資料ページ
    attachment_patterns:
      - "\\.pdf$"

  - name: kyouikuiinkai
    description: "教育委員会 定例会等資料（令和8年以降）"
    type: index
    # ※ 一覧の入口ページのアドレスは未確認です。エラーになる場合は区のサイトで確認して修正してください。
    url: "https://www.city.bunkyo.lg.jp/kosodatekyouiku/kyouiku/kyouikuiinkai/teireikai/index.html"
    output_profile: council
    interval_days: 7
    max_depth: 1
    max_pages: 100
    list_patterns:
      - "/kyouikuiinkai/teireikai/r(0[8-9]|[1-9][0-9])/index\\.html$"
    exclude_patterns:
      - "/index\\.html$"
    attachment_patterns:
      - "\\.pdf$"

  # 会議録（速報版）の一覧ページのアドレスが分かったら、次のように追加してください。
  # - name: kaigiroku_sokuhou
  #   description: "区議会 会議録（速報版）"
  #   type: index
  #   url: "（一覧ページのアドレス）"
  #   output_profile: council
  #   interval_days: 7
  #   max_pages: 100
  #   attachment_patterns:
  #     - "\\.pdf$"

database:
  path: "data/bunkyo_crawler.db"

ai:
  provider: anthropic
  model: "claude-opus-5-5"
  effort: "medium"                 # low / medium / high / xhigh / max
  api_key_env: "ANTHROPIC_API_KEY" # APIキーを読み込む環境変数名
  prompts_file: "config/prompts.yaml"
  timeout_sec: 600
  max_retries: 3                   # SDK側のリトライ回数（429/5xx/接続エラー）
  use_refusal_fallback: true       # 安全分類器による拒否時、サーバー側で代替モデルに切替
  max_input_chars: 150000          # AIに渡す本文の上限。超過時は生成をスキップしてログに記録
  min_input_chars: 50              # これ未満の本文は生成対象外（空ページ等）
  max_documents_per_run: 30        # run で1回にAI生成する文書数の上限（残りは次回・generate で）

logging:
  level: "INFO"
  file: "logs/bunkyo_crawler.log"
